<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUREÍ DUBAI — Account Access</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Login Modal Overlay -->
  <div id="loginModal" class="modal-overlay" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    
    <!-- Modal Card -->
    <div class="modal-card" style="position: relative; width: 440px; background: #FAF8F5; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); font-family: 'Cinzel', sans-serif;">
      
      <!-- Top-Left Back Arrow Exit Button -->
      <button id="modalBackBtn" style="position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 22px; cursor: pointer; color: #1A1815; transition: transform 0.2s;" onclick="document.getElementById('loginModal').style.display='none'">←</button>

      <!-- Modal Header -->
      <div style="margin-top: 10px; margin-bottom: 25px;">
        <h2 style="font-size: 20px; letter-spacing: 1.5px; color: #1A1815; margin: 0;">LUREÍ DUBAI — Account Access</h2>
      </div>

      <!-- Auth Tabs -->
      <div style="display: flex; border-bottom: 1px solid #E5E0D8; margin-bottom: 25px;">
        <button style="flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid #C5A059; font-weight: 600; font-size: 11px; letter-spacing: 1px; color: #1A1815; cursor: pointer;">SIGN IN</button>
        <button style="flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid transparent; font-weight: 600; font-size: 11px; letter-spacing: 1px; color: #888275; cursor: pointer;">CREATE FREE ACCOUNT</button>
      </div>

      <div style="text-align: center; font-size: 10px; letter-spacing: 1px; color: #888275; margin-bottom: 20px;">OR CONTINUE WITH EMAIL</div>

      <!-- Form Inputs -->
      <form style="display: flex; flex-direction: column; gap: 18px;" onsubmit="event.preventDefault();">
        
        <!-- Email Field -->
        <div style="display: flex; flex-direction: column; text-align: left;">
          <label style="font-size: 10px; letter-spacing: 1px; color: #5A554A; margin-bottom: 6px; font-weight: 600;">EMAIL ADDRESS</label>
          <input type="email" placeholder="you@email.com" style="width: 100%; padding: 12px 16px; border: 1px solid #E5E0D8; border-radius: 8px; background: #FFFFFF; font-size: 13px; color: #1A1815; outline: none; box-sizing: border-box;">
        </div>

        <!-- Password Field with Show/Hide Eye Icon -->
        <div style="display: flex; flex-direction: column; text-align: left;">
          <label style="font-size: 10px; letter-spacing: 1px; color: #5A554A; margin-bottom: 6px; font-weight: 600;">PASSWORD</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="password" id="passwordInput" placeholder="Enter your password" style="width: 100%; padding: 12px 45px 12px 16px; border: 1px solid #E5E0D8; border-radius: 8px; background: #FFFFFF; font-size: 13px; color: #1A1815; outline: none; box-sizing: border-box;">
            
            <!-- Eye Toggle Icon -->
            <span id="togglePasswordBtn" style="position: absolute; right: 15px; cursor: pointer; color: #888275; display: flex; align-items: center;" onclick="togglePass()">
              <svg id="eyeSvg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" style="width: 100%; padding: 14px; background: #C5A059; color: #FFFFFF; border: none; border-radius: 25px; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(197,160,89,0.3);">LOGIN</button>
      
      </form>

      <!-- Guest Access -->
      <div style="text-align: center; margin-top: 15px;">
        <a href="#" style="font-size: 11px; color: #888275; text-decoration: none;" onclick="document.getElementById('loginModal').style.display='none'">Continue as Guest</a>
      </div>

    </div>
  </div>

  <script>
    // Password Show / Hide Toggle Function
    function togglePass() {
      const input = document.getElementById('passwordInput');
      const btn = document.getElementById('togglePasswordBtn');
      const svg = document.getElementById('eyeSvg');
      
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.color = '#C5A059'; // Champagne Gold when visible
        svg.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        input.type = 'password';
        btn.style.color = '#888275';
        svg.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    }
  </script>

</body>
</html>
